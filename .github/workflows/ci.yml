# Checks every push and pull request on Windows and macOS (and the no-op
# path on Linux) and builds the rust-toast program for Windows x64 and
# macOS (universal: arm64 + x64) as workflow artifacts; a version tag
# (v0.3.1) also attaches them, with SHA-256 checksums, to a GitHub release
# for that tag.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features cli -- -D warnings
      - run: cargo test
      - run: cargo test --features cli
      - run: cargo build --example demo

  build:
    name: build (${{ matrix.name }})
    needs: check
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # tr: a Windows checkout may have CRLF line ends.
          version=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Build (Windows x64)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
          cargo build --release --features cli --bin rust-toast --target x86_64-pc-windows-msvc
          mkdir dist
          cp target/x86_64-pc-windows-msvc/release/rust-toast.exe dist/rust-toast-windows-x64.exe
          dist/rust-toast-windows-x64.exe --version
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --features cli --bin rust-toast --target "$t"
          done
          mkdir dist
          lipo -create -output dist/rust-toast-macos-universal \
            target/aarch64-apple-darwin/release/rust-toast \
            target/x86_64-apple-darwin/release/rust-toast
          lipo -info dist/rust-toast-macos-universal
          dist/rust-toast-macos-universal --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum rust-toast-* > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" rust-toast-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
