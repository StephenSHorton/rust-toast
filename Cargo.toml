[package]
name = "rust-toast"
version = "0.4.0"
edition = "2024"
license = "MIT"
publish = false
description = "Native notification cards for Windows and macOS: stacked in a screen corner, over every window, never take focus, with buttons, sounds and confetti"
repository = "https://github.com/StephenSHorton/rust-toast"
readme = "README.md"

[lib]
name = "toast"

# The command-line program (`rust-toast`, PROTOCOL.md) for apps not written
# in Rust. Behind the `cli` feature, so the library pulls in nothing new:
# `cargo build --release --features cli`.
[[bin]]
name = "rust-toast"
path = "src/bin/rust-toast.rs"
required-features = ["cli"]

[features]
cli = ["dep:serde", "dep:serde_json", "dep:png", "dep:zune-jpeg"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"], optional = true }
serde_json = { version = "1.0.140", optional = true }
png = { version = "0.17.16", optional = true }
zune-jpeg = { version = "0.4.14", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# The AppKit side (src/darwin.rs). It cannot be compiled on the PC; the Mac
# builds and checks it (MAC.md). Their default features enable every
# module; a Tauri app already has them in its Cargo.lock.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
dispatch2 = "0.3.1"
block2 = "0.6.2"
